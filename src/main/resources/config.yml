# PlayerCouncil Configuration

council:
  size: 12
  min-total-hours: 100
  min-active-members: 3
  recalc-day: SUNDAY
  recalc-hour: 0

activity:
  tracked-stats:
    - stat: PLAY_ONE_MINUTE
      weight: 1.0
      scale: 72000
    - stat: WALK_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: AVIATE_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: MOB_KILLS
      weight: 1.0
      scale: 1

display:
  enabled: false
  refresh-seconds: 300
  top-n: 10
  title: "Council Race"

voting:
  ban-new: 1
  ban-veteran: 2
  veteran-hours: 100
  pardon: 2
  reban: 4
  repardon: 8
  council-ban: 8
  gamerule: 8
  plugin: 8
  suggestion: 8
  proposal-timeout-days: 7
  # Auto-close any proposal this many hours after creation if it has fewer than
  # stale-min-yes-votes YES votes. Clock starts at create time (does not reset).
  stale-hours: 24
  stale-min-yes-votes: 2
  restart-warning-minutes: 10
  ban-cooldown-days: 7

ban:
  provider: smartban
  ban-command: "ban {player} {reason}"
  unban-command: "unban {player} {reason}"

ban-review:
  enabled: true
  max-prompts-per-join: 5
  lookback-days: 7
  review-expire-days: 7

discord:
  webhook-url: ""
  username: "Player Council"
  bot-token: ""
  bot-token-file: ""
  guild-id: "1533577292851183879"
  council-role-id: "1549609974072746066"
  council-channel-id: "1549613458767609936"
  invite-url: "https://discord.gg/Z23akyxpQZ"
  proposals-channel-id: ""
  use-forum: false

council-web:
  enabled: true
  url: "https://dontplaythisserver.com/api/councilweb/login-code"
  public-base: "https://dontplaythisserver.com"
  token-file: ""
  token: ""
  code-ttl-seconds: 120
  cooldown-seconds: 30
  health-interval-seconds: 15

plugins:
  whitelist: []

bugs:
  cooldown-seconds: 600
  min-length: 8
  max-length: 240
  max-open-per-player: 3
  max-per-day: 3
  min-hours: 1
  list-limit: 15
  auto-block-false-closes: 3

messages:
  prefix: "<gray>[<gold>Council</gold>]</gray> "
