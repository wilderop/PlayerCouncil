# PlayerCouncil Configuration

council:
  size: 12
  min-total-hours: 100
  min-active-members: 3
  recalc-day: SUNDAY
  recalc-hour: 0

activity:
  tracked-stats:
    - stat: PLAY_ONE_MINUTE
      weight: 1.0
      scale: 72000
    - stat: WALK_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: AVIATE_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: MOB_KILLS
      weight: 1.0
      scale: 1

voting:
  ban: 1
  pardon: 2
  reban: 4
  repardon: 8
  gamerule: 8
  plugin: 8
  proposal-timeout-days: 7
  restart-warning-minutes: 10
  # After a ban on you is overturned, you cannot propose bans for this many days
  ban-cooldown-days: 7

discord:
  webhook-url: ""
  username: "Player Council"

plugins:
  whitelist: []

messages:
  prefix: "<gray>[<gold>Council</gold>]</gray> "
