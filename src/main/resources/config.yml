# PlayerCouncil Configuration

council:
  # Number of seats on the council
  size: 12
  # Minimum total playtime in hours required to be eligible for council
  min-total-hours: 100
  # Minimum number of filled council seats required before proposals/bans are allowed.
  min-active-members: 3
  # Weekly council seat refresh (server local time)
  recalc-day: SUNDAY
  # Hour 0-23 (midnight = 0)
  recalc-hour: 0

activity:
  tracked-stats:
    - stat: PLAY_ONE_MINUTE
      weight: 1.0
      scale: 72000
    - stat: WALK_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: AVIATE_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: MOB_KILLS
      weight: 1.0
      scale: 1

display:
  enabled: false
  refresh-seconds: 300
  top-n: 10
  title: "Council Race"

voting:
  ban-new: 1
  ban-veteran: 2
  veteran-hours: 100
  pardon: 2
  reban: 4
  repardon: 8
  council-ban: 8
  gamerule: 8
  plugin: 8
  suggestion: 8
  proposal-timeout-days: 7
  restart-warning-minutes: 10
  ban-cooldown-days: 7

ban:
  provider: smartban
  ban-command: "ban {player} {reason}"
  unban-command: "unban {player} {reason}"

# Automated ban review: when council members join, prompt about recent bans
ban-review:
  enabled: true
  max-prompts-per-join: 5
  lookback-days: 7
  review-expire-days: 7

discord:
  webhook-url: ""
  username: "Player Council"
  bot-token: ""
  proposals-channel-id: ""
  use-forum: false

plugins:
  whitelist: []

messages:
  prefix: "<gray>[<gold>Council</gold>]</gray> "
