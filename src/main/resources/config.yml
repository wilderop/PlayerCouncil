# PlayerCouncil Configuration

council:
  size: 12
  min-total-hours: 100
  min-active-members: 3
  recalc-day: SUNDAY
  recalc-hour: 0

activity:
  tracked-stats:
    - stat: PLAY_ONE_MINUTE
      weight: 1.0
      scale: 72000
    - stat: WALK_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: AVIATE_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: MOB_KILLS
      weight: 1.0
      scale: 1

display:
  enabled: false
  refresh-seconds: 300
  top-n: 10
  title: "Council Race"

voting:
  ban-new: 1
  ban-veteran: 2
  veteran-hours: 100
  pardon: 2
  reban: 4
  repardon: 8
  council-ban: 8
  gamerule: 8
  plugin: 8
  suggestion: 8
  proposal-timeout-days: 7
  # Auto-close any proposal this many hours after creation if it has fewer than
  # stale-min-yes-votes YES votes. Clock starts at create time (does not reset).
  stale-hours: 24
  stale-min-yes-votes: 2
  restart-warning-minutes: 10
  ban-cooldown-days: 7

ban:
  provider: smartban
  ban-command: "ban {player} {reason}"
  unban-command: "unban {player} {reason}"

ban-review:
  enabled: true
  max-prompts-per-join: 5
  lookback-days: 7
  review-expire-days: 7

discord:
  webhook-url: ""
  username: "Player Council"
  bot-token: ""
  proposals-channel-id: ""
  use-forum: false

plugins:
  whitelist: []

messages:
  prefix: "<gray>[<gold>Council</gold>]</gray> "
