# PlayerCouncil Configuration

council:
  # Number of seats on the council
  size: 12
  # Minimum total playtime in hours required to be eligible for council
  min-total-hours: 100
  # Minimum number of filled council seats required before proposals/bans are allowed.
  # Until this many members exist, the voting system stays inactive.
  min-active-members: 3
  # Weekly council seat refresh (server local time)
  # Day of week: MONDAY..SUNDAY
  recalc-day: SUNDAY
  # Hour 0-23 (midnight = 0)
  recalc-hour: 0

activity:
  # Vanilla UNTYPED statistics used for activity scoring.
  # score contribution = weight * (delta / scale)
  # Only Statistic.Type.UNTYPED values work (no per-block / per-entity stats).
  # Manage in-game: /counciladmin stat list|add|remove|setweight|setscale
  tracked-stats:
    - stat: PLAY_ONE_MINUTE
      weight: 1.0
      scale: 72000      # ticks → hours
    - stat: WALK_ONE_CM
      weight: 1.0
      scale: 100000     # cm → km
    - stat: AVIATE_ONE_CM
      weight: 1.0
      scale: 100000
    - stat: MOB_KILLS
      weight: 1.0
      scale: 1

voting:
  # First ban of a NEW player (< veteran-hours): this many yes votes
  ban-new: 1
  # First ban of a VETERAN (>= veteran-hours): this many yes votes
  ban-veteran: 2
  # Total hours that separates new vs veteran for ban threshold
  veteran-hours: 100
  pardon: 2
  reban: 4
  repardon: 8
  # Votes to ban a sitting council member OR any account that has shared an IP
  # with a sitting council member (alt protection). Defaults to 8.
  council-ban: 8
  gamerule: 8
  plugin: 8
  # Advisory suggestion proposals (text only, no auto action)
  suggestion: 8
  proposal-timeout-days: 7
  restart-warning-minutes: 10
  # After a ban on you is overturned, you cannot propose bans for this many days
  ban-cooldown-days: 7

# How council ban/unban commands are executed
ban:
  # smartban = incremental SmartBan plugin | vanilla = Minecraft /ban /pardon
  provider: smartban
  # {player} and {reason} are substituted
  ban-command: "ban {player} {reason}"
  # SmartBan requires a reason on unban
  unban-command: "unban {player} {reason}"

discord:
  webhook-url: ""
  username: "Player Council"

plugins:
  # Plugins the council may enable/disable
  whitelist: []

messages:
  prefix: "<gray>[<gold>Council</gold>]</gray> "
