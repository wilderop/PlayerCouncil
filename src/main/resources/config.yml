# PlayerCouncil Configuration

council:
  size: 12
  min-total-hours: 10
  min-active-members: 3
  recalc-interval-hours: 24

activity:
  weights:
    playtime: 1.0
    walk: 1.0
    fly: 1.0
    mob_kills: 1.0

voting:
  ban: 1
  pardon: 2
  reban: 4
  repardon: 8
  gamerule: 8
  plugin: 8
  proposal-timeout-days: 7
  restart-warning-minutes: 10

discord:
  webhook-url: ""
  username: "Player Council"

plugins:
  whitelist: []

messages:
  prefix: "<gray>[<gold>Council</gold>]</gray> "
